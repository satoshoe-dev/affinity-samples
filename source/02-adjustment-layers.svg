<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="800" viewBox="0 0 1200 800">
<title>Adjustment layers</title>
<defs>
<linearGradient id="regenbogen" x1="0" x2="1"><stop offset="0.000" stop-color="#ff0000"/><stop offset="0.167" stop-color="#ffff00"/><stop offset="0.333" stop-color="#00ff00"/><stop offset="0.500" stop-color="#00ffff"/><stop offset="0.667" stop-color="#0000ff"/><stop offset="0.833" stop-color="#ff00ff"/><stop offset="1.000" stop-color="#ff0000"/></linearGradient>
<linearGradient id="grau" x1="0" x2="1"><stop offset="0" stop-color="#000"/><stop offset="1" stop-color="#fff"/></linearGradient>
</defs>
<rect id="background" width="1200" height="800" fill="#f4f1ea"/>
<text x="600.0" y="30" font-family="Fira Sans" font-size="22" font-weight="400" text-anchor="middle" fill="#2e282a">Adjustment layers</text>
<g id="levels">
<rect x="20.0" y="60.0" width="260.0" height="180.0" fill="url(#regenbogen)"/>
<rect x="20.0" y="240.0" width="260.0" height="120.0" fill="url(#grau)"/>
</g>
<text x="150.0" y="390.0" font-family="Fira Sans" font-size="17" font-weight="400" text-anchor="middle" fill="#2e282a">Levels</text>
<g id="curves">
<rect x="320.0" y="60.0" width="260.0" height="180.0" fill="url(#regenbogen)"/>
<rect x="320.0" y="240.0" width="260.0" height="120.0" fill="url(#grau)"/>
</g>
<text x="450.0" y="390.0" font-family="Fira Sans" font-size="17" font-weight="400" text-anchor="middle" fill="#2e282a">Curves</text>
<g id="hsl">
<rect x="620.0" y="60.0" width="260.0" height="180.0" fill="url(#regenbogen)"/>
<rect x="620.0" y="240.0" width="260.0" height="120.0" fill="url(#grau)"/>
</g>
<text x="750.0" y="390.0" font-family="Fira Sans" font-size="17" font-weight="400" text-anchor="middle" fill="#2e282a">HSL</text>
<g id="brightness-contrast">
<rect x="920.0" y="60.0" width="260.0" height="180.0" fill="url(#regenbogen)"/>
<rect x="920.0" y="240.0" width="260.0" height="120.0" fill="url(#grau)"/>
</g>
<text x="1050.0" y="390.0" font-family="Fira Sans" font-size="17" font-weight="400" text-anchor="middle" fill="#2e282a">Brightness/Contrast</text>
<g id="black-and-white">
<rect x="20.0" y="440.0" width="260.0" height="180.0" fill="url(#regenbogen)"/>
<rect x="20.0" y="620.0" width="260.0" height="120.0" fill="url(#grau)"/>
</g>
<text x="150.0" y="770.0" font-family="Fira Sans" font-size="17" font-weight="400" text-anchor="middle" fill="#2e282a">Black and White</text>
<g id="invert">
<rect x="320.0" y="440.0" width="260.0" height="180.0" fill="url(#regenbogen)"/>
<rect x="320.0" y="620.0" width="260.0" height="120.0" fill="url(#grau)"/>
</g>
<text x="450.0" y="770.0" font-family="Fira Sans" font-size="17" font-weight="400" text-anchor="middle" fill="#2e282a">Invert</text>
<g id="recolour">
<rect x="620.0" y="440.0" width="260.0" height="180.0" fill="url(#regenbogen)"/>
<rect x="620.0" y="620.0" width="260.0" height="120.0" fill="url(#grau)"/>
</g>
<text x="750.0" y="770.0" font-family="Fira Sans" font-size="17" font-weight="400" text-anchor="middle" fill="#2e282a">Recolour</text>
<g id="selective-colour">
<rect x="920.0" y="440.0" width="260.0" height="180.0" fill="url(#regenbogen)"/>
<rect x="920.0" y="620.0" width="260.0" height="120.0" fill="url(#grau)"/>
</g>
<text x="1050.0" y="770.0" font-family="Fira Sans" font-size="17" font-weight="400" text-anchor="middle" fill="#2e282a">Selective colour</text>
</svg>
