<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="800" viewBox="0 0 1200 800">
<title>Gradients</title>
<defs><linearGradient id="lin"><stop offset="0" stop-color="#e4572e"/><stop offset="1" stop-color="#29335c"/></linearGradient><radialGradient id="rad"><stop offset="0" stop-color="#ffc914"/><stop offset="1" stop-color="#8f2d56"/></radialGradient></defs>
<rect id="background" width="1200" height="800" fill="#f4f1ea"/>
<text x="600.0" y="30" font-family="Fira Sans" font-size="22" font-weight="400" text-anchor="middle" fill="#2e282a">Gradients</text>
<circle id="g1" cx="200.0" cy="215.0" r="120" fill="url(#lin)"/>
<text x="200.0" y="400.0" font-family="Fira Sans" font-size="17" font-weight="400" text-anchor="middle" fill="#2e282a">Linear (reference)</text>
<circle id="g2" cx="600.0" cy="215.0" r="120" fill="url(#rad)"/>
<text x="600.0" y="400.0" font-family="Fira Sans" font-size="17" font-weight="400" text-anchor="middle" fill="#2e282a">Radial (reference)</text>
<circle id="g3" cx="1000.0" cy="215.0" r="120" fill="#cccccc"/>
<text x="1000.0" y="400.0" font-family="Fira Sans" font-size="17" font-weight="400" text-anchor="middle" fill="#2e282a">Elliptical</text>
<circle id="g4" cx="200.0" cy="595.0" r="120" fill="#cccccc"/>
<text x="200.0" y="780.0" font-family="Fira Sans" font-size="17" font-weight="400" text-anchor="middle" fill="#2e282a">Conical</text>
<circle id="g5" cx="600.0" cy="595.0" r="120" fill="#cccccc"/>
<text x="600.0" y="780.0" font-family="Fira Sans" font-size="17" font-weight="400" text-anchor="middle" fill="#2e282a">Conical, 3 stops</text>
<circle id="g6" cx="1000.0" cy="595.0" r="120" fill="#cccccc"/>
<text x="1000.0" y="780.0" font-family="Fira Sans" font-size="17" font-weight="400" text-anchor="middle" fill="#2e282a">Conical, off-centre</text>
</svg>
