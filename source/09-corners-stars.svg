<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="800" viewBox="0 0 1200 800">
<title>Corner types and stars</title>
<rect id="background" width="1200" height="800" fill="#f4f1ea"/>
<text x="600.0" y="30" font-family="Fira Sans" font-size="22" font-weight="400" text-anchor="middle" fill="#2e282a">Corner types and stars</text>
<g id="rounded-(reference)">
<rect x="60.0" y="146.0" width="180.0" height="144.0" fill="#e4572e"/>
<text x="150.0" y="406.0" font-family="Fira Sans" font-size="17" font-weight="400" text-anchor="middle" fill="#2e282a">Rounded (reference)</text>
</g>
<g id="straight">
<rect x="360.0" y="146.0" width="180.0" height="144.0" fill="#f3a712"/>
<text x="450.0" y="406.0" font-family="Fira Sans" font-size="17" font-weight="400" text-anchor="middle" fill="#2e282a">Straight</text>
</g>
<g id="concave">
<rect x="660.0" y="146.0" width="180.0" height="144.0" fill="#29335c"/>
<text x="750.0" y="406.0" font-family="Fira Sans" font-size="17" font-weight="400" text-anchor="middle" fill="#2e282a">Concave</text>
</g>
<g id="inset">
<rect x="960.0" y="146.0" width="180.0" height="144.0" fill="#669bbc"/>
<text x="1050.0" y="406.0" font-family="Fira Sans" font-size="17" font-weight="400" text-anchor="middle" fill="#2e282a">Inset</text>
</g>
<g id="mixed-per-corner">
<rect x="60.0" y="526.0" width="180.0" height="144.0" fill="#17bebb"/>
<text x="150.0" y="786.0" font-family="Fira Sans" font-size="17" font-weight="400" text-anchor="middle" fill="#2e282a">Mixed per corner</text>
</g>
<g id="smooth">
<rect x="360.0" y="526.0" width="180.0" height="144.0" fill="#8f2d56"/>
<text x="450.0" y="786.0" font-family="Fira Sans" font-size="17" font-weight="400" text-anchor="middle" fill="#2e282a">Smooth</text>
</g>
<g id="star,-rounded-points">
<rect x="660.0" y="526.0" width="180.0" height="144.0" fill="#76b041"/>
<text x="750.0" y="786.0" font-family="Fira Sans" font-size="17" font-weight="400" text-anchor="middle" fill="#2e282a">Star, rounded points</text>
</g>
<g id="star,-rounded-inner">
<rect x="960.0" y="526.0" width="180.0" height="144.0" fill="#ffc914"/>
<text x="1050.0" y="786.0" font-family="Fira Sans" font-size="17" font-weight="400" text-anchor="middle" fill="#2e282a">Star, rounded inner</text>
</g>
</svg>
